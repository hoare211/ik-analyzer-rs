[package]
name = "ik-analyzer-py"
# 版本继承自 [workspace.package]，避免与核心库漂移（评审 P3-1）
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ik_analyzer"  # 这是最终在 Python 中 `import ik_analyzer` 的名字
crate-type = ["cdylib"]

[dependencies]
ik-analyzer-core = { package = "ik-analyzer-rs", path = ".." }
pyo3 = { version = "0.26.0", features = ["extension-module", "abi3-py38"] }
